[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "debpak"
version = "0.1.0"
description = "Import-gap analysis for running binaries elsewhere: Linux packages (.deb, .rpm, Arch, AppImage, snap, tarballs) to Flatpak, Windows apps on Wine, macOS apps on Darling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
zstd = ["zstandard"]

[project.scripts]
debpak = "debpak.cli:main"
winegap = "debpak.cli_compat:winegap_main"
machgap = "debpak.cli_compat:machgap_main"
gaprank = "debpak.cli_compat:gaprank_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "C4", "RUF", "PIE", "C90"]
ignore = [
    "E501",    # long lines: the formatter's job, not the linter's
    "RUF005",  # [*a, b] vs a + [b]: taste
    "SIM105",  # contextlib.suppress vs try/except: taste
    "RUF001", "RUF002", "RUF003",  # Unicode punctuation in strings and comments is deliberate
]

[tool.ruff.lint.mccabe]
# every function in src/ below cyclomatic complexity 15
max-complexity = 14

[tool.ruff.lint.per-file-ignores]
# one-off sampling scripts: json.load(open(f)) is fine for a script that exits right after
"tests/compat/sampling/*" = ["SIM115", "E741", "E402"]
# stand-in classes in tests set plain class attributes
"tests/*" = ["RUF012", "C901"]

[tool.mypy]
python_version = "3.10"
files = ["src/debpak"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
