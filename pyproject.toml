[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "debpak"
version = "0.1.0"
description = "Import-gap analysis for running binaries elsewhere (.deb to Flatpak, Windows apps on Wine, macOS apps on Darling), and appbridge, a launcher for Microsoft 365, Adobe and other Windows work apps on Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
zstd = ["zstandard"]
gui = ["PySide6-Essentials>=6.5"]

[project.scripts]
debpak = "debpak.cli:main"
winegap = "debpak.cli_compat:winegap_main"
machgap = "debpak.cli_compat:machgap_main"
gaprank = "debpak.cli_compat:gaprank_main"
appbridge = "debpak.appbridge.cli:main"

[project.gui-scripts]
appbridge-gui = "debpak.appbridge.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
