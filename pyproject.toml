[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "debpak"
version = "0.1.0"
description = "Import-gap analysis for running binaries elsewhere: Linux packages (.deb, .rpm, Arch, AppImage, tarballs) to Flatpak, Windows apps on Wine, macOS apps on Darling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
zstd = ["zstandard"]

[project.scripts]
debpak = "debpak.cli:main"
winegap = "debpak.cli_compat:winegap_main"
machgap = "debpak.cli_compat:machgap_main"
gaprank = "debpak.cli_compat:gaprank_main"

[tool.setuptools.packages.find]
where = ["src"]
